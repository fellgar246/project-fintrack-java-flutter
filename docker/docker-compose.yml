services:
  db:
    image: postgres:16
    container_name: fintrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host 5435 -> macOS's native Postgres and other projects already occupy 5432-5434;
      # the container keeps listening on 5432 internally.
      - "5435:5432"
    volumes:
      - fintrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API service. Activated with the "full" profile once the Dockerfile exists (F7.1).
  # In development, Spring Boot is run from the IDE against the `db` service above.
  api:
    build:
      context: ../backend
    container_name: fintrack-api
    restart: unless-stopped
    profiles: ["full"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fintrack_pgdata:
