services:
  db:
    image: postgres:16
    container_name: fintrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host 5435 -> macOS's native Postgres and other projects already occupy 5432-5434;
      # the container keeps listening on 5432 internally.
      - "5435:5432"
    volumes:
      - fintrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API service — use profile "full" for one-command demo.
  # In development, run Spring Boot from the IDE against the `db` service above.
  api:
    build:
      context: ../backend
    container_name: fintrack-api
    restart: unless-stopped
    profiles: ["full"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/api/v1/actuator/health | grep -q '\"status\":\"UP\"' || exit 1",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  fintrack_pgdata:
